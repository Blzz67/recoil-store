<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Scripts — RECOILSCRIPTS</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particle-bg"></div>
    
    <div class="weapons-container">
        <h1 class="weapons-title">YOUR <span class="accent">SCRIPTS</span></h1>
        <p class="weapons-subtitle">Select a weapon to view and download the script</p>
        
        <div class="weapons-grid" id="weaponsGrid">
            <!-- Weapon boxes will be added here by JavaScript -->
        </div>
    </div>

    <!-- Script viewer modal -->
    <div class="modal" id="scriptModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modalWeaponName"></h2>
            <div class="script-preview" id="scriptPreview"></div>
            <a id="modalDownloadBtn" class="btn-download-large" download>DOWNLOAD SCRIPT</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Weapon data - CHANGE THESE TO MATCH YOUR EXACT FILE NAMES
        const weapons = [
            { name: "F2", script: "download/f2.ahk" },
            { name: "SMG-11", script: "download/smg11.ahk" },
            { name: "R4-C", script: "download/r4c.ahk" },
            { name: "AK-12", script: "download/ak12.ahk" },
            { name: "M762", script: "download/m762.ahk" },
            { name: "C8-SFW", script: "download/c8sfw.ahk" },
            { name: "MP5", script: "download/mp5.ahk" },
            { name: "P90", script: "download/p90.ahk" },
            { name: "Vector .45", script: "download/vector.ahk" },
            { name: "M4", script: "download/m4.ahk" },
            { name: "G36C", script: "download/g36c.ahk" },
            { name: "LMG-E", script: "download/lmge.ahk" }
        ];

        // Create weapon boxes
        const grid = document.getElementById('weaponsGrid');
        
        weapons.forEach(weapon => {
            const box = document.createElement('div');
            box.className = 'weapon-box';
            box.onclick = () => openModal(weapon);
            
            box.innerHTML = `
                <span class="weapon-box-name">${weapon.name}</span>
            `;
            
            grid.appendChild(box);
        });

        // Modal functions
        function openModal(weapon) {
            document.getElementById('scriptModal').style.display = 'flex';
            document.getElementById('modalWeaponName').textContent = weapon.name + ' - Recoil Script';
            document.getElementById('modalDownloadBtn').href = weapon.script;
            document.getElementById('modalDownloadBtn').setAttribute('download', weapon.name + '_recoil.ahk');
            
            fetch(weapon.script)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('scriptPreview').textContent = data;
                })
                .catch(() => {
                    document.getElementById('scriptPreview').textContent = 'Script will be downloaded when you click the button below.';
                });
        }

        function closeModal() {
            document.getElementById('scriptModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('scriptModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
